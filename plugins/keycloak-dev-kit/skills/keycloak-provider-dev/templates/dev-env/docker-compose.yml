# Development environment for a Keycloak provider (extension JAR).
# Template from the keycloak-provider-dev skill: rename the project, the realm
# import and the ports as needed. See the skill's references/dev-environment.md.
#
# Default profile: one Keycloak (start-dev, H2) behind an nginx reverse proxy.
# Profile "cluster" (opt-in): two Keycloak nodes on PostgreSQL behind nginx:
#   docker compose --profile cluster up -d postgres kc1 kc2 proxy-cluster

name: ${COMPOSE_PROJECT_NAME:-kc-provider-dev}

x-keycloak-common: &keycloak-common
  image: keycloak/keycloak:${KC_VERSION:-26.7}
  volumes:
    - ./providers:/opt/keycloak/providers:ro
    - ./import:/opt/keycloak/data/import:ro

services:
  # --- default profile -------------------------------------------------------
  keycloak:
    <<: *keycloak-common
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      # Public URL = the proxy: every issuer/endpoint URL is built on it, even on the direct port.
      KC_HOSTNAME: ${KC_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-INFO}
      # Remote debugging (JDWP); KC_DEBUG_SUSPEND=y waits for the debugger (to debug init/postInit).
      KC_DEBUG: "true"
      KC_DEBUG_PORT: "*:8787"
      KC_DEBUG_SUSPEND: ${KC_DEBUG_SUSPEND:-n}
    ports:
      - "${KC_DIRECT_PORT:-8081}:8080"   # Keycloak directly, without the proxy
      - "${KC_MGMT_PORT:-9000}:9000"     # management: /health/ready, /metrics
      - "${KC_DEBUG_HOST_PORT:-8787}:8787"

  proxy:
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${KC_PROXY_PORT:-8080}:80"
    depends_on:
      - keycloak

  # --- cluster profile -------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    profiles: ["cluster"]

  kc1: &cluster-node
    <<: *keycloak-common
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: ${KC_CLUSTER_PUBLIC_URL:-http://localhost:8090}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_CACHE: ispn
      KC_CACHE_STACK: jdbc-ping
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-INFO}
    depends_on:
      - postgres
    healthcheck:
      # the image has no curl: probe the management port with bash /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    profiles: ["cluster"]

  kc2:
    <<: *cluster-node
    # start only after kc1 has created the schema: two nodes initialising an
    # empty database at the same time race on the Liquibase changelog table
    depends_on:
      kc1:
        condition: service_healthy

  proxy-cluster:
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    volumes:
      - ./nginx/cluster.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${KC_CLUSTER_PROXY_PORT:-8090}:80"
    depends_on:
      - kc1
      - kc2
    profiles: ["cluster"]
