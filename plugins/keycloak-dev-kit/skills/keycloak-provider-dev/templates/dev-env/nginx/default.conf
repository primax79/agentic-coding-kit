# Reverse proxy in front of the dev Keycloak (default profile).
# Add per-location overrides above "location /", e.g. to fix a well-known
# media type Keycloak cannot emit (see the skill's references/pitfalls.md):
#
#   location ~ ^/realms/[^/]+/\.well-known/<alias>$ {
#       proxy_set_header Accept "application/jwt";
#       proxy_hide_header Content-Type;
#       add_header Content-Type "<media/type>" always;
#       proxy_pass http://keycloak;
#   }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream keycloak {
    server keycloak:8080;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;

    location / {
        proxy_pass http://keycloak;
    }
}
